name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  VITE_SUPABASE_URL: https://ci.invalid
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: icarecenter-frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true
      - run: npm ci
        working-directory: icarecenter-frontend
      - run: npm run typecheck
        working-directory: icarecenter-frontend
      - run: npm exec -- ultracite doctor
        working-directory: icarecenter-frontend
      - run: npm exec -- ultracite check
        working-directory: icarecenter-frontend
      - run: npm audit --audit-level=low --omit=optional
        working-directory: icarecenter-frontend
      - run: npm run test:ssr
        working-directory: icarecenter-frontend
      - run: npm run test:edge
        working-directory: icarecenter-frontend
      - run: npm run test:architecture -- --config trashAssetsBeforeRuns=false
        working-directory: icarecenter-frontend
      - name: Start Vite for browser tests
        run: npm run dev -- --host 127.0.0.1 > /tmp/icare-vite.log 2>&1 &
        working-directory: icarecenter-frontend
      - name: Wait for Vite
        run: curl --fail --silent --retry 60 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080 >/dev/null
      - run: npx cypress run --config-file ../icarecenter-test/cypress.config.cjs --spec ../icarecenter-test/e2e/sermons/youtube-livestream.cy.ts
        working-directory: icarecenter-frontend
      - run: npm run build:ssr
        working-directory: icarecenter-frontend
      - name: Print Vite diagnostics on failure
        if: failure()
        run: |
          if [ -f /tmp/icare-vite.log ]; then
            cat /tmp/icare-vite.log
          else
            echo "No Vite log was created."
          fi
