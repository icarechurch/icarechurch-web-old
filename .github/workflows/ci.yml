name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:edge
      - run: npm run test:architecture -- --config trashAssetsBeforeRuns=false
      - name: Start Vite for browser tests
        run: npm run dev -- --host 127.0.0.1 > /tmp/icare-vite.log 2>&1 &
      - name: Wait for Vite
        run: curl --fail --silent --retry 60 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080 >/dev/null
      - run: npx cypress run --spec cypress/e2e/sermons/youtube-livestream.cy.ts --config trashAssetsBeforeRuns=false
      - run: npm run build:ssr
